receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 256
  attributes/evidence_boundary:
    actions:
      - key: patient_id
        action: delete
      - key: subject_name
        action: delete
      - key: authorization
        action: delete
  batch:
    send_batch_size: 512
    timeout: 5s

exporters:
  debug:
    verbosity: basic

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, attributes/evidence_boundary, batch]
      exporters: [debug]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, attributes/evidence_boundary, batch]
      exporters: [debug]

