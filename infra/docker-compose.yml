services:
  postgres:
    image: postgres:17.10-alpine
    environment:
      POSTGRES_DB: laboratory
      POSTGRES_USER: laboratory_bootstrap
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U laboratory_bootstrap -d laboratory"]
      interval: 5s
      timeout: 3s
      retries: 20

  database-role-provisioner:
    image: postgres:17.10-alpine
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      POSTGRES_DB: laboratory
      POSTGRES_USER: laboratory_bootstrap
    secrets:
      - postgres_password
    volumes:
      - ../database/provision_cluster_roles.sql:/workspace/provision_cluster_roles.sql:ro
    entrypoint: ["/bin/sh", "-eu", "-c"]
    command:
      - >-
        export PGPASSWORD="$$(cat /run/secrets/postgres_password)";
        exec psql --set=ON_ERROR_STOP=1
        --file=/workspace/provision_cluster_roles.sql
    restart: "no"

  database-migrator:
    build:
      context: ..
      dockerfile: infra/migrator.Dockerfile
    depends_on:
      database-role-provisioner:
        condition: service_completed_successfully
    environment:
      FLYWAY_URL: jdbc:postgresql://postgres:5432/laboratory
      FLYWAY_USER: laboratory_bootstrap
    secrets:
      - postgres_password
    restart: "no"

  database-role-bootstrap:
    image: postgres:17.10-alpine
    depends_on:
      database-migrator:
        condition: service_completed_successfully
    environment:
      PGHOST: postgres
      POSTGRES_DB: laboratory
      POSTGRES_USER: laboratory_bootstrap
    secrets:
      - postgres_password
      - postgres_app_password
      - postgres_outbox_password
      - postgres_recovery_password
      - postgres_evidence_password
      - postgres_migrator_password
      - postgres_tenant_hmac_key
    volumes:
      - ./postgres-init/010_application_password.sh:/usr/local/bin/configure-database-identities:ro
    entrypoint: ["/usr/local/bin/configure-database-identities"]
    restart: "no"

  application-db-check:
    image: postgres:17.10-alpine
    profiles: ["proof"]
    depends_on:
      database-role-bootstrap:
        condition: service_completed_successfully
    environment:
      PGHOST: postgres
      PGDATABASE: laboratory
      PGUSER: laboratory_app
    secrets:
      - postgres_app_password
    entrypoint: ["/bin/sh", "-eu", "-c"]
    command:
      - >-
        export PGPASSWORD="$$(cat /run/secrets/postgres_app_password)";
        psql --set=ON_ERROR_STOP=1
        --command="select current_user, rolsuper, rolbypassrls from pg_roles where rolname = current_user"

  object-store:
    image: minio/minio:RELEASE.2025-07-23T15-54-02Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: synthetic-local-admin
      MINIO_ROOT_PASSWORD_FILE: /run/secrets/minio_password
    secrets:
      - minio_password
    volumes:
      - object-data:/data

  telemetry:
    image: otel/opentelemetry-collector-contrib:0.130.1
    command: ["--config=/etc/otel/config.yaml"]
    volumes:
      - ./otel-collector.yaml:/etc/otel/config.yaml:ro
    ports:
      - "127.0.0.1:4317:4317"
      - "127.0.0.1:4318:4318"

secrets:
  postgres_password:
    file: ./secrets/postgres_password.txt
  minio_password:
    file: ./secrets/minio_password.txt
  postgres_app_password:
    file: ./secrets/postgres_app_password.txt
  postgres_outbox_password:
    file: ./secrets/postgres_outbox_password.txt
  postgres_recovery_password:
    file: ./secrets/postgres_recovery_password.txt
  postgres_evidence_password:
    file: ./secrets/postgres_evidence_password.txt
  postgres_migrator_password:
    file: ./secrets/postgres_migrator_password.txt
  postgres_tenant_hmac_key:
    file: ./secrets/postgres_tenant_hmac_key.txt

volumes:
  postgres-data:
  object-data:
