services:
  postgres:
    image: postgres:17.10-alpine@sha256:742f40ea20b9ff2ff31db5458d127452988a2164df9e17441e191f3b72252193
    environment:
      POSTGRES_DB: laboratory
      POSTGRES_USER: laboratory_bootstrap
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U laboratory_bootstrap -d laboratory"]
      interval: 5s
      timeout: 3s
      retries: 20

  database-role-provisioner:
    image: postgres:17.10-alpine@sha256:742f40ea20b9ff2ff31db5458d127452988a2164df9e17441e191f3b72252193
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGDATABASE: laboratory
      PGUSER: laboratory_bootstrap
    secrets:
      - postgres_password
      - postgres_migrator_password
    volumes:
      - ../database/provision_cluster_roles.sql:/workspace/provision_cluster_roles.sql:ro
      - ./provision-migrator-identity.sh:/usr/local/bin/provision-migrator-identity:ro
      - ./secret-files.sh:/usr/local/lib/lims/secret-files.sh:ro
    entrypoint: ["/usr/local/bin/provision-migrator-identity"]
    restart: "no"

  database-migrator:
    build:
      context: ${LIMS_MIGRATOR_CONTEXT:-..}
      dockerfile: infra/migrator.Dockerfile
    depends_on:
      database-role-provisioner:
        condition: service_completed_successfully
    environment:
      FLYWAY_URL: jdbc:postgresql://postgres:5432/laboratory
      FLYWAY_USER: laboratory_migrator
    secrets:
      - postgres_migrator_password
    restart: "no"

  database-role-bootstrap:
    image: postgres:17.10-alpine@sha256:742f40ea20b9ff2ff31db5458d127452988a2164df9e17441e191f3b72252193
    depends_on:
      database-migrator:
        condition: service_completed_successfully
    environment:
      PGHOST: postgres
      POSTGRES_DB: laboratory
      POSTGRES_USER: laboratory_bootstrap
    secrets:
      - postgres_password
      - postgres_app_password
      - postgres_outbox_password
      - postgres_recovery_password
      - postgres_evidence_password
      - postgres_tenant_hmac_key
    volumes:
      - ./postgres-init/010_application_password.sh:/usr/local/bin/configure-database-identities:ro
      - ./secret-files.sh:/usr/local/lib/lims/secret-files.sh:ro
    entrypoint: ["/usr/local/bin/configure-database-identities"]
    restart: "no"

  application-db-check:
    image: postgres:17.10-alpine@sha256:742f40ea20b9ff2ff31db5458d127452988a2164df9e17441e191f3b72252193
    profiles: ["proof"]
    depends_on:
      database-role-bootstrap:
        condition: service_completed_successfully
    environment:
      PGHOST: postgres
      PGDATABASE: laboratory
      PGUSER: laboratory_app
    secrets:
      - postgres_app_password
    volumes:
      - ./secret-files.sh:/usr/local/lib/lims/secret-files.sh:ro
      - ./check-application-identity.sh:/usr/local/bin/check-application-identity:ro
    entrypoint: ["/bin/sh", "/usr/local/bin/check-application-identity"]

  application:
    profiles: ["workbench"]
    build:
      context: ${LIMS_APPLICATION_CONTEXT:-./prepared-application}
      dockerfile: Dockerfile
    depends_on:
      database-role-bootstrap:
        condition: service_completed_successfully
    user: "${LIMS_RUNTIME_UID:-10001}:${LIMS_RUNTIME_GID:-10001}"
    read_only: true
    init: true
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 128
    mem_limit: 512m
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m,mode=1777
    environment:
      LIMS_WORKBENCH_ADAPTER: postgresql
      LIMS_WORKBENCH_DB_HOST: postgres
      LIMS_WORKBENCH_DB_PASSWORD_FILE: /run/secrets/postgres_app_password
      LIMS_WORKBENCH_TENANT_KEY_FILE: /run/secrets/postgres_tenant_hmac_key
    secrets:
      - postgres_app_password
      - postgres_tenant_hmac_key
    ports:
      - "127.0.0.1:${LIMS_WORKBENCH_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=6).close()"]
      interval: 10s
      timeout: 8s
      retries: 12

  object-store:
    profiles: ["object-storage"]
    image: minio/minio:RELEASE.2025-07-23T15-54-02Z@sha256:d249d1fb6966de4d8ad26c04754b545205ff15a62e4fd19ebd0f26fa5baacbc0
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: synthetic-local-admin
      MINIO_ROOT_PASSWORD_FILE: /run/secrets/minio_password
    secrets:
      - minio_password
    volumes:
      - object-data:/data

  telemetry:
    profiles: ["telemetry"]
    image: otel/opentelemetry-collector-contrib:0.130.1@sha256:9c247564e65ca19f97d891cca19a1a8d291ce631b890885b44e3503c5fdb3895
    command: ["--config=/etc/otel/config.yaml"]
    volumes:
      - ./otel-collector.yaml:/etc/otel/config.yaml:ro
    ports:
      - "127.0.0.1:4317:4317"
      - "127.0.0.1:4318:4318"

secrets:
  postgres_password:
    file: ${LIMS_SECRET_DIR:-./secrets}/postgres_password.txt
  minio_password:
    file: ${LIMS_SECRET_DIR:-./secrets}/minio_password.txt
  postgres_app_password:
    file: ${LIMS_SECRET_DIR:-./secrets}/postgres_app_password.txt
  postgres_outbox_password:
    file: ${LIMS_SECRET_DIR:-./secrets}/postgres_outbox_password.txt
  postgres_recovery_password:
    file: ${LIMS_SECRET_DIR:-./secrets}/postgres_recovery_password.txt
  postgres_evidence_password:
    file: ${LIMS_SECRET_DIR:-./secrets}/postgres_evidence_password.txt
  postgres_migrator_password:
    file: ${LIMS_SECRET_DIR:-./secrets}/postgres_migrator_password.txt
  postgres_tenant_hmac_key:
    file: ${LIMS_SECRET_DIR:-./secrets}/postgres_tenant_hmac_key.txt

volumes:
  postgres-data:
  object-data:
