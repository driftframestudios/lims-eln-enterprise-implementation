# Apply this fragment to a connector whose table include-list contains only
# public.transactional_outbox. Connection and broker credentials stay in the
# deployment platform's secret provider.
transforms=outbox
transforms.outbox.type=io.debezium.transforms.outbox.EventRouter
transforms.outbox.table.field.event.id=message_id
transforms.outbox.table.field.event.key=aggregate_id
transforms.outbox.table.field.event.type=topic
transforms.outbox.table.field.event.payload=payload
transforms.outbox.table.field.event.timestamp=created_at_utc
transforms.outbox.route.by.field=topic
transforms.outbox.route.topic.replacement=${routedByValue}
transforms.outbox.table.fields.additional.placement=tenant_id:header:tenant_id,aggregate_version:header:aggregate_version,payload_sha256:header:payload_sha256,payload_canonicalization:header:payload_canonicalization
transforms.outbox.table.op.invalid.behavior=error
