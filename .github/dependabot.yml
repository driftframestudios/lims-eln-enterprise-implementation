# Monthly version updates enter develop through small, reviewable groups.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    groups:
      github-actions-minor-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: pip
    directory: /
    target-branch: develop
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    groups:
      pip-minor-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: docker
    directory: /infra
    target-branch: develop
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    groups:
      docker-minor-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: terraform
    directory: /infra/terraform
    target-branch: develop
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    groups:
      terraform-minor-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
