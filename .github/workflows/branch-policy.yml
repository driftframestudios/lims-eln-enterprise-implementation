name: branch-policy

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read

jobs:
  branch-shape:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check GitFlow-like branch shape
        env:
          HEAD_REF: ${{ github.head_ref }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          case "$HEAD_REF:$BASE_REF" in
            feature/*:develop|fix/*:develop|chore/*:develop|forecast/*:develop|evidence/*:develop|release/*:main|hotfix/*:main)
              exit 0
              ;;
            *)
              echo "Use a governed change branch into develop, and release/ or hotfix/ into main."
              exit 1
              ;;
          esac
