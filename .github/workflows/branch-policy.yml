name: branch-policy

on:
  pull_request_target:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read

jobs:
  branch-shape:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out base-controlled policy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: base-policy
          persist-credentials: false

      - name: Check GitFlow-like branch coordinates
        working-directory: base-policy
        env:
          HEAD_REF: ${{ github.head_ref }}
          BASE_REF: ${{ github.base_ref }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        run: >-
          python3 scripts/check_branch_flow.py
          --base "$BASE_REF"
          --head "$HEAD_REF"
          --author "$PR_AUTHOR"
