name: implementation

on:
  pull_request:
  push:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: implementation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package and standard development tools
        run: python -m pip install --disable-pip-version-check -e '.[dev]'
      - name: Check package, style, tests, and wheel
        run: |
          python scripts/validate_implementation.py
          python -m ruff check src tests scripts
          python -m unittest discover -s tests -v
          python -m build

  postgres:
    name: PostgreSQL 17 migrations and domain invariants
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17.10-alpine@sha256:742f40ea20b9ff2ff31db5458d127452988a2164df9e17441e191f3b72252193
        env:
          POSTGRES_DB: laboratory
          POSTGRES_USER: laboratory_bootstrap
          POSTGRES_PASSWORD: synthetic-ci-bootstrap-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U laboratory_bootstrap -d laboratory"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      LIMS_TEST_POSTGRES_ADMIN_DSN: postgresql://laboratory_bootstrap:synthetic-ci-bootstrap-password@127.0.0.1:5432/laboratory
      LIMS_TEST_POSTGRES_APP_DSN: postgresql://laboratory_app:synthetic-ci-app-password@127.0.0.1:5432/laboratory
      FLYWAY_IMAGE: flyway/flyway:13.0.0-alpine@sha256:f3c8433401abf859ef9022584c8e6111684363ec490f737e749e9a4705ea32d0
      FLYWAY_URL: jdbc:postgresql://127.0.0.1:5432/laboratory
      FLYWAY_USER: laboratory_migrator
      FLYWAY_PASSWORD: synthetic-ci-migrator-password
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
          cache: pip
      - name: Install PostgreSQL client and package
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql-client
          python -m pip install --disable-pip-version-check -e '.[dev]'
      - name: Provision migration-compatible roles
        env:
          PGPASSWORD: synthetic-ci-bootstrap-password
        run: |
          psql "$LIMS_TEST_POSTGRES_ADMIN_DSN" --no-psqlrc \
            --set ON_ERROR_STOP=1 --file database/provision_cluster_roles.sql
          psql "$LIMS_TEST_POSTGRES_ADMIN_DSN" --no-psqlrc \
            --set ON_ERROR_STOP=1 \
            --command="alter role laboratory_migrator password 'synthetic-ci-migrator-password'; alter role laboratory_app password 'synthetic-ci-app-password'"
      - name: Apply and validate Flyway migrations
        run: |
          run_flyway() {
            docker run --rm --network host \
              --volume "$GITHUB_WORKSPACE:/flyway/project:ro" \
              --env FLYWAY_URL --env FLYWAY_USER --env FLYWAY_PASSWORD \
              "$FLYWAY_IMAGE" \
              -workingDirectory=/flyway/project \
              -configFiles=/flyway/project/flyway.conf "$@"
          }
          run_flyway migrate
          run_flyway validate
          run_flyway info
          run_flyway migrate
      - name: Prove domain and outbox behavior against PostgreSQL
        run: python -m unittest tests.test_postgres_integration -v
