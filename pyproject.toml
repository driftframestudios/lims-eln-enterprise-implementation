[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lims-eln-enterprise-implementation"
version = "0.4.0"
description = "Synthetic reference implementation for LIMS/ELN vendor evaluation"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
authors = [{name = "driftframestudios"}]
dependencies = [
  "aws-lambda-powertools[aws-sdk]>=3.23,<4",
  "pydantic>=2.12,<3",
  "tenacity>=9,<10",
]

[project.optional-dependencies]
dev = [
  "build>=1.3,<2",
  "ruff>=0.15,<1",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100
